name: Validate workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Data preservation, assessment rules and scope isolation
        run: node --test tests/core.test.cjs
      - name: PWA assets, manifest and syntax
        run: node tests/assets.test.cjs
